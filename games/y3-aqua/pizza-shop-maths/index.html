<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pizza Shop Maths</title>
  <style>
    :root {
      --bg-color: #fff8e7;
      --crust-color: #e67e22;
      --sauce-color: #d32f2f;
      --cheese-color: #f1c40f;
      --cheese-hover: #f39c12;
      --text-color: #4a2c11;
      --card-bg: #ffffff;
    }

    * {
      box-sizing: border-box;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #game-container {
      background-color: var(--card-bg);
      border: 8px solid var(--crust-color);
      border-radius: 24px;
      width: 100%;
      max-width: 650px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      position: relative;
    }

    h1 {
      color: var(--sauce-color);
      font-size: 2.2rem;
      margin-top: 0;
      margin-bottom: 10px;
    }

    .status-bar {
      display: flex;
      justify-content: space-around;
      background-color: #ffe0b2;
      padding: 12px;
      border-radius: 16px;
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .pizza-icon {
      font-size: 4rem;
      margin: 10px 0;
    }

    .story-box {
      font-size: 1.3rem;
      line-height: 1.5;
      margin-bottom: 20px;
      color: var(--text-color);
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .input-section {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    input[type="number"] {
      width: 120px;
      font-size: 1.8rem;
      text-align: center;
      border: 4px solid var(--crust-color);
      border-radius: 12px;
      padding: 5px;
      outline: none;
    }

    .btn {
      background-color: var(--cheese-color);
      color: var(--text-color);
      border: 4px solid var(--crust-color);
      border-radius: 16px;
      padding: 12px 24px;
      font-size: 1.3rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
    }

    .btn:hover {
      background-color: var(--cheese-hover);
      transform: scale(1.05);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .feedback {
      font-size: 1.2rem;
      font-weight: bold;
      min-height: 40px;
      margin-bottom: 15px;
    }

    .feedback.success { color: #2e7d32; }
    .feedback.hint { color: #e65100; }

    /* Canvas styling for Brick Breaker */
    canvas {
      background: #fff3e0;
      border: 4px solid var(--sauce-color);
      border-radius: 16px;
      display: block;
      margin: 0 auto 15px auto;
      max-width: 100%;
    }

    .hidden {
      display: none !important;
    }

    .big-stats {
      font-size: 1.5rem;
      margin: 15px 0;
      line-height: 1.8;
    }
  </style>
</head>
<body>

<div id="game-container">
  <!-- Top Header / Scoreboard -->
  <div class="status-bar">
    <span id="level-display">Level: 1 / 5</span>
    <span id="money-display">💰 $0</span>
    <span id="pizzas-display">🍕 0 Baked</span>
  </div>

  <!-- SCREEN 1: MATH QUESTION -->
  <div id="math-screen">
    <div class="pizza-icon">🍕</div>
    <div id="question-text" class="story-box">Loading question...</div>

    <div class="input-section">
      <input type="number" id="answer-input" placeholder="?" min="0" max="100" />
      <button class="btn" id="submit-btn" onclick="checkAnswer()">Serve Pizza!</button>
    </div>

    <div id="feedback-text" class="feedback"></div>
  </div>

  <!-- SCREEN 2: BRICK BREAKER REWARD -->
  <div id="reward-screen" class="hidden">
    <h2 style="color: var(--sauce-color); margin-top:0;">🎉 Level Complete! Mini Game Time!</h2>
    <p>Bounce the pizza dough to collect toppings!</p>
    <canvas id="brickCanvas" width="480" height="320"></canvas>
    <button class="btn hidden" id="next-level-btn" onclick="startNextLevel()">Next Level 🍕</button>
  </div>

  <!-- SCREEN 3: GAME FINISHED -->
  <div id="finish-screen" class="hidden">
    <div class="pizza-icon">🏆 🍕 🏆</div>
    <h1>You Finished! Super Chef!</h1>
    <p style="font-size: 1.3rem;">You ran a fantastic pizza shop today!</p>
    <div class="big-stats">
      💰 Total Money Earned: <strong id="final-money">$0</strong><br />
      🍕 Total Pizzas Baked: <strong id="final-pizzas">0</strong>
    </div>
    <button class="btn" onclick="resetGame()">Play Again 🔄</button>
  </div>
</div>

<script>
  // Game Questions (Year 3 level addition/subtraction up to 100)
  const levels = [
    // Level 1: Simple Addition/Subtraction under 30
    [
      { q: "You baked 12 cheese pizzas and 8 pepperoni pizzas. How many pizzas did you bake in total?", a: 20, baked: 20, earn: 10 },
      { q: "You had 15 slices of pizza and sold 5 slices. How many slices are left?", a: 10, baked: 0, earn: 5 },
      { q: "A customer bought 6 garlic breads and 7 pizzas. How many items did they buy?", a: 13, baked: 7, earn: 8 }
    ],
    // Level 2: Under 50
    [
      { q: "You baked 24 pizzas in the morning and sold 9. How many pizzas are left?", a: 15, baked: 24, earn: 12 },
      { q: "There are 18 mushroom slices and 14 pepper slices. How many slices altogether?", a: 32, baked: 0, earn: 10 },
      { q: "You have 35 boxes. You use 12 to deliver pizzas. How many boxes remain?", a: 23, baked: 12, earn: 10 }
    ],
    // Level 3: Up to 70
    [
      { q: "You baked 40 pizzas. A big party bought 25 of them! How many are left?", a: 15, baked: 40, earn: 20 },
      { q: "You need 50 tomatoes. You already have 32. How many more tomatoes do you need to buy?", a: 18, baked: 0, earn: 12 },
      { q: "31 children and 19 adults came to your pizza party. How many guests were there total?", a: 50, baked: 20, earn: 15 }
    ],
    // Level 4: Up to 85
    [
      { q: "You made 65 mini pizzas. 22 were veggie and the rest were cheese. How many were cheese?", a: 43, baked: 65, earn: 20 },
      { q: "Your shop made $45 in the morning and $35 in the afternoon. How much money in total?", a: 80, baked: 15, earn: 25 },
      { q: "You started with 72 olives and used 30 on pizzas. How many olives are left?", a: 42, baked: 0, earn: 15 }
    ],
    // Level 5: Up to 100
    [
      { q: "You baked 55 pizzas on Saturday and 45 on Sunday. How many pizzas did you bake over the weekend?", a: 100, baked: 100, earn: 30 },
      { q: "You had 90 pizza boxes and used 44 during dinner time. How many boxes do you have left?", a: 46, baked: 0, earn: 20 },
      { q: "Your grand total pizza goal is 88. You have baked 50 so far. How many more do you need?", a: 38, baked: 38, earn: 25 }
    ]
  ];

  // State Variables
  let currentLevelIdx = 0;
  let currentQuestionIdx = 0;
  let totalMoney = 0;
  let totalPizzas = 0;
  let attempts = 0;

  // DOM Elements
  const levelDisplay = document.getElementById('level-display');
  const moneyDisplay = document.getElementById('money-display');
  const pizzasDisplay = document.getElementById('pizzas-display');
  const questionText = document.getElementById('question-text');
  const answerInput = document.getElementById('answer-input');
  const feedbackText = document.getElementById('feedback-text');
  const mathScreen = document.getElementById('math-screen');
  const rewardScreen = document.getElementById('reward-screen');
  const finishScreen = document.getElementById('finish-screen');
  const nextLevelBtn = document.getElementById('next-level-btn');

  // Load First Question
  function loadQuestion() {
    attempts = 0;
    answerInput.value = '';
    feedbackText.textContent = '';
    feedbackText.className = 'feedback';
    
    const currentQ = levels[currentLevelIdx][currentQuestionIdx];
    questionText.textContent = currentQ.q;
    levelDisplay.textContent = `Level: ${currentLevelIdx + 1} / 5`;
    moneyDisplay.textContent = `💰 $${totalMoney}`;
    pizzasDisplay.textContent = `🍕 ${totalPizzas} Baked`;
    answerInput.focus();
  }

  // Check Answer
  function checkAnswer() {
    const userAns = parseInt(answerInput.value, 10);
    const currentQ = levels[currentLevelIdx][currentQuestionIdx];

    if (isNaN(userAns)) {
      feedbackText.textContent = "Type your answer in the box above! 😊";
      feedbackText.className = 'feedback hint';
      return;
    }

    if (userAns === currentQ.a) {
      // Correct!
      totalMoney += currentQ.earn;
      totalPizzas += currentQ.baked;
      moneyDisplay.textContent = `💰 $${totalMoney}`;
      pizzasDisplay.textContent = `🍕 ${totalPizzas} Baked`;
      
      feedbackText.textContent = "🌟 Great job! That's right!";
      feedbackText.className = 'feedback success';

      setTimeout(() => {
        currentQuestionIdx++;
        if (currentQuestionIdx >= levels[currentLevelIdx].length) {
          // Level completed
          currentQuestionIdx = 0;
          showRewardScreen();
        } else {
          loadQuestion();
        }
      }, 1200);

    } else {
      // Friendly Retry
      attempts++;
      if (userAns < currentQ.a) {
        feedbackText.textContent = "Nice try! The answer is a little higher. Try again! 👍";
      } else {
        feedbackText.textContent = "So close! The answer is a little lower. Try again! 👍";
      }
      feedbackText.className = 'feedback hint';
    }
  }

  // Allow pressing "Enter" key
  answerInput.addEventListener('keyup', function(e) {
    if (e.key === 'Enter') checkAnswer();
  });

  // Switch to Brick Breaker Reward
  function showRewardScreen() {
    mathScreen.classList.add('hidden');
    rewardScreen.classList.remove('hidden');
    nextLevelBtn.classList.add('hidden');
    startBrickBreaker();
  }

  // Next Level Transition
  function startNextLevel() {
    currentLevelIdx++;
    if (currentLevelIdx >= levels.length) {
      showFinishScreen();
    } else {
      rewardScreen.classList.add('hidden');
      mathScreen.classList.remove('hidden');
      loadQuestion();
    }
  }

  // Show Final Screen
  function showFinishScreen() {
    rewardScreen.classList.add('hidden');
    mathScreen.classList.add('hidden');
    finishScreen.classList.remove('hidden');
    document.getElementById('final-money').textContent = `$${totalMoney}`;
    document.getElementById('final-pizzas').textContent = `${totalPizzas} Pizzas`;
  }

  // Reset Entire Game
  function resetGame() {
    currentLevelIdx = 0;
    currentQuestionIdx = 0;
    totalMoney = 0;
    totalPizzas = 0;
    finishScreen.classList.add('hidden');
    mathScreen.classList.remove('hidden');
    loadQuestion();
  }

  // ----------------------------------------------------
  // BRICK BREAKER MINI-GAME
  // ----------------------------------------------------
  const canvas = document.getElementById("brickCanvas");
  const ctx = canvas.getContext("2d");

  let ballRadius = 10;
  let x, y, dx, dy;
  let paddleHeight = 14;
  let paddleWidth = 90;
  let paddleX;
  let rightPressed = false;
  let leftPressed = false;

  const brickRowCount = 3;
  const brickColumnCount = 5;
  const brickWidth = 75;
  const brickHeight = 22;
  const brickPadding = 12;
  const brickOffsetTop = 25;
  const brickOffsetLeft = 22;

  let bricks = [];

  function initBricks() {
    for (let c = 0; c < brickColumnCount; c++) {
      bricks[c] = [];
      for (let r = 0; r < brickRowCount; r++) {
        bricks[c][r] = { x: 0, y: 0, status: 1 };
      }
    }
  }

  function startBrickBreaker() {
    x = canvas.width / 2;
    y = canvas.height - 30;
    dx = 3;
    dy = -3;
    paddleX = (canvas.width - paddleWidth) / 2;
    initBricks();
    
    document.addEventListener("keydown", keyDownHandler, false);
    document.addEventListener("keyup", keyUpHandler, false);
    document.addEventListener("mousemove", mouseMoveHandler, false);

    draw();
  }

  function keyDownHandler(e) {
    if (e.key === "Right" || e.key === "ArrowRight") rightPressed = true;
    else if (e.key === "Left" || e.key === "ArrowLeft") leftPressed = true;
  }

  function keyUpHandler(e) {
    if (e.key === "Right" || e.key === "ArrowRight") rightPressed = false;
    else if (e.key === "Left" || e.key === "ArrowLeft") leftPressed = false;
  }

  function mouseMoveHandler(e) {
    const relativeX = e.clientX - canvas.getBoundingClientRect().left;
    if (relativeX > 0 && relativeX < canvas.width) {
      paddleX = relativeX - paddleWidth / 2;
    }
  }

  function collisionDetection() {
    let bricksLeft = 0;
    for (let c = 0; c < brickColumnCount; c++) {
      for (let r = 0; r < brickRowCount; r++) {
        const b = bricks[c][r];
        if (b.status === 1) {
          bricksLeft++;
          if (x > b.x && x < b.x + brickWidth && y > b.y && y < b.y + brickHeight) {
            dy = -dy;
            b.status = 0;
            bricksLeft--;
          }
        }
      }
    }

    if (bricksLeft === 0) {
      // Cleared all bricks!
      nextLevelBtn.classList.remove('hidden');
      return true;
    }
    return false;
  }

  function drawBall() {
    ctx.beginPath();
    ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
    ctx.fillStyle = "#e67e22"; // Dough color
    ctx.fill();
    ctx.strokeStyle = "#d32f2f";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.closePath();
  }

  function drawPaddle() {
    ctx.beginPath();
    ctx.rect(paddleX, canvas.height - paddleHeight, paddleWidth, paddleHeight);
    ctx.fillStyle = "#f1c40f"; // Cheese color
    ctx.fill();
    ctx.strokeStyle = "#e67e22";
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.closePath();
  }

  function drawBricks() {
    const colors = ["#d32f2f", "#2e7d32", "#f39c12"]; // Pepperoni, Pepper, Cheese
    for (let c = 0; c < brickColumnCount; c++) {
      for (let r = 0; r < brickRowCount; r++) {
        if (bricks[c][r].status === 1) {
          const brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
          const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
          bricks[c][r].x = brickX;
          bricks[c][r].y = brickY;
          ctx.beginPath();
          ctx.rect(brickX, brickY, brickWidth, brickHeight);
          ctx.fillStyle = colors[r % colors.length];
          ctx.fill();
          ctx.borderRadius = 6;
          ctx.closePath();
        }
      }
    }
  }

  let animationFrameId;

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBricks();
    drawBall();
    drawPaddle();

    const win = collisionDetection();
    if (win) {
      ctx.font = "20px Comic Sans MS";
      ctx.fillStyle = "#2e7d32";
      ctx.fillText("Yay! You collected all toppings!", 80, 180);
      return; // Stop animation loop
    }

    // Bounce off left/right
    if (x + dx > canvas.width - ballRadius || x + dx < ballRadius) {
      dx = -dx;
    }

    // Bounce off top
    if (y + dy < ballRadius) {
      dy = -dy;
    } else if (y + dy > canvas.height - ballRadius) {
      // Hit bottom - safe bounce so children never lose!
      if (x > paddleX && x < paddleX + paddleWidth) {
        dy = -dy;
      } else {
        // Soft bounce off floor so no scary game over
        dy = -dy;
      }
    }

    if (rightPressed && paddleX < canvas.width - paddleWidth) {
      paddleX += 6;
    } else if (leftPressed && paddleX > 0) {
      paddleX -= 6;
    }

    x += dx;
    y += dy;

    if (rewardScreen.classList.contains('hidden') === false) {
      animationFrameId = requestAnimationFrame(draw);
    }
  }

  // Initialize
  loadQuestion();
</script>
</body>
</html>
