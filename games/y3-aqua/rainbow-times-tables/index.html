<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainbow Times Tables</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            user-select: none;
        }

        body {
            /* 七彩彩虹背景 */
            background: linear-gradient(135deg, 
                #ff9a9e 0%, #fecfef 20%, 
                #a1c4fd 40%, #c2e9fb 60%, 
                #d4fc79 80%, #96e6a1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 游戏主容器 */
        #game-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 24px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            text-align: center;
            position: relative;
            border: 4px solid #fff;
        }

        /* 标题设计 */
        h1 {
            font-size: 2.2rem;
            background: linear-gradient(to right, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #8b00ff);
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        /* 答题界面元素 */
        .info-bar {
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: bold;
            color: #555;
            margin-bottom: 20px;
            background: #f0f4f8;
            padding: 10px 15px;
            border-radius: 12px;
        }

        .level-badge {
            color: #ff007f;
        }

        .question-box {
            font-size: 2.5rem;
            font-weight: bold;
            color: #2c3e50;
            margin: 25px 0;
            background: #fff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.05);
            border: 2px dashed #a1c4fd;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* 彩虹色按钮 */
        .btn-option {
            font-size: 1.5rem;
            font-weight: bold;
            padding: 15px;
            border: none;
            border-radius: 16px;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 0 rgba(0,0,0,0.15);
        }

        .btn-option:nth-child(1) { background: linear-gradient(to right, #ff758c, #ff7eb3); }
        .btn-option:nth-child(2) { background: linear-gradient(to right, #4facfe, #00f2fe); }
        .btn-option:nth-child(3) { background: linear-gradient(to right, #43e97b, #38f9d7); color: #333; }

        .btn-option:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.15);
        }

        .feedback {
            height: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 15px;
        }
        .correct { color: #2ed573; }
        .wrong { color: #ff4757; }

        /* 星星动画容器 */
        .stars-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            border-radius: 24px;
        }

        .star {
            position: absolute;
            font-size: 2rem;
            animation: floatUp 1s ease-out forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }

        /* 隐藏类 */
        .hidden { display: none !important; }

        /* 奖励游戏样式 */
        canvas {
            background: #333;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: block;
            margin: 10px auto;
        }

        .controls-hint {
            font-size: 0.9rem;
            color: #666;
            margin-top: 8px;
        }

        .btn-start {
            background: linear-gradient(to right, #ff9900, #ff5500);
            color: white;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 12px 30px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 5px 0 #cc4400;
        }
        .btn-start:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #cc4400;
        }
    </style>
</head>
<body>

    <div id="game-card">
        <div class="stars-container" id="stars-box"></div>
        <h1>🌈 Rainbow Times Tables</h1>

        <!-- 问答界面 -->
        <div id="quiz-screen">
            <div class="info-bar">
                <span class="level-badge" id="level-txt">等级 1/5</span>
                <span id="score-txt">得分: 0</span>
            </div>

            <div class="question-box" id="q-box">2 × 3 = ?</div>

            <div class="options-grid">
                <button class="btn-option" onclick="checkAnswer(0)">A</button>
                <button class="btn-option" onclick="checkAnswer(1)">B</button>
                <button class="btn-option" onclick="checkAnswer(2)">C</button>
            </div>

            <div class="feedback" id="feedback-txt"></div>
        </div>

        <!-- 通关提示与奖励游戏进入界面 -->
        <div id="reward-intro" class="hidden">
            <h2 style="color: #ff007f; margin-bottom: 10px;">🎉 太棒了！通关啦！</h2>
            <p id="final-quiz-score" style="font-size: 1.2rem; margin-bottom: 15px; color: #333;"></p>
            <p style="font-size: 1rem; color: #555;">你解锁了奖励游戏：<br><strong>🏎️ 躲避汽车 (Car Dodger)</strong></p>
            <button class="btn-start" onclick="startCarGame()">开始极速躲避！</button>
        </div>

        <!-- 躲避汽车游戏界面 -->
        <div id="car-game-screen" class="hidden">
            <div class="info-bar">
                <span>🚘 躲避时间: <span id="car-time">0</span>s</span>
                <span>最高纪录: <span id="car-score">0</span></span>
            </div>
            <canvas id="gameCanvas" width="300" height="350"></canvas>
            <div class="controls-hint">使用键盘 ⬅️ ➡️ 左右方向键控制小车</div>
            <button id="restart-car-btn" class="btn-start hidden" onclick="startCarGame()">再玩一次</button>
        </div>
    </div>

    <script>
        /* ------------------- 1. 问答游戏数据与逻辑 ------------------- */
        // 15道乘法题，分为5个等级，每级3题（从2的乘法递增到9的乘法）
        const questions = [
            // 等级 1 (2-3的乘法)
            { q: "2 × 3 = ?", options: [6, 8, 5], a: 0 },
            { q: "3 × 4 = ?", options: [10, 12, 14], a: 1 },
            { q: "2 × 8 = ?", options: [18, 14, 16], a: 2 },
            // 等级 2 (4-5的乘法)
            { q: "4 × 5 = ?", options: [20, 25, 15], a: 0 },
            { q: "5 × 7 = ?", options: [30, 35, 40], a: 1 },
            { q: "4 × 8 = ?", options: [28, 36, 32], a: 2 },
            // 等级 3 (6的乘法)
            { q: "6 × 3 = ?", options: [18, 24, 16], a: 0 },
            { q: "6 × 6 = ?", options: [30, 36, 42], a: 1 },
            { q: "6 × 9 = ?", options: [48, 56, 54], a: 2 },
            // 等级 4 (7-8的乘法)
            { q: "7 × 4 = ?", options: [28, 24, 32], a: 0 },
            { q: "8 × 7 = ?", options: [54, 56, 64], a: 1 },
            { q: "7 × 9 = ?", options: [61, 72, 63], a: 2 },
            // 等级 5 (9的乘法)
            { q: "9 × 3 = ?", options: [27, 24, 30], a: 0 },
            { q: "9 × 6 = ?", options: [45, 54, 63], a: 1 },
            { q: "9 × 8 = ?", options: [81, 64, 72], a: 2 }
        ];

        let currentQIndex = 0;
        let score = 0;
        let attemptsLeft = 2; // 每题最多尝试2次（错一次可重试一次）

        function loadQuestion() {
            const q = questions[currentQIndex];
            const level = Math.floor(currentQIndex / 3) + 1;
            
            document.getElementById("level-txt").innerText = `等级 ${level}/5`;
            document.getElementById("score-txt").innerText = `得分: ${score}`;
            document.getElementById("q-box").innerText = q.q;
            document.getElementById("feedback-txt").innerText = "";

            const btns = document.querySelectorAll(".btn-option");
            q.options.forEach((opt, idx) => {
                btns[idx].innerText = opt;
                btns[idx].style.opacity = "1";
                btns[idx].disabled = false;
            });

            attemptsLeft = 2;
        }

        function checkAnswer(selectedIdx) {
            const q = questions[currentQIndex];
            const feedback = document.getElementById("feedback-txt");

            if (selectedIdx === q.a) {
                // 答对
                score += (attemptsLeft === 2) ? 10 : 5; // 首答对得10分，重试答对得5分
                feedback.className = "feedback correct";
                feedback.innerText = "✨ 答对啦！太棒了！";
                createStars();

                setTimeout(() => {
                    currentQIndex++;
                    if (currentQIndex < questions.length) {
                        loadQuestion();
                    } else {
                        finishQuiz();
                    }
                }, 1000);
            } else {
                // 答错
                attemptsLeft--;
                if (attemptsLeft > 0) {
                    feedback.className = "feedback wrong";
                    feedback.innerText = "❌ 没关系，再试一次吧！";
                    // 禁用选错的按钮
                    const btns = document.querySelectorAll(".btn-option");
                    btns[selectedIdx].style.opacity = "0.4";
                    btns[selectedIdx].disabled = true;
                } else {
                    feedback.className = "feedback wrong";
                    feedback.innerText = `加把劲，正确答案是 ${q.options[q.a]}`;
                    setTimeout(() => {
                        currentQIndex++;
                        if (currentQIndex < questions.length) {
                            loadQuestion();
                        } else {
                            finishQuiz();
                        }
                    }, 1500);
                }
            }
        }

        // 答对时的彩虹星星效果
        function createStars() {
            const container = document.getElementById("stars-box");
            const starColors = ["⭐", "🌟", "✨", "🎉"];
            for (let i = 0; i < 8; i++) {
                const star = document.createElement("div");
                star.className = "star";
                star.innerText = starColors[Math.floor(Math.random() * starColors.length)];
                star.style.left = Math.random() * 80 + 10 + "%";
                star.style.top = "60%";
                container.appendChild(star);
                setTimeout(() => star.remove(), 1000);
            }
        }

        function finishQuiz() {
            document.getElementById("quiz-screen").classList.add("hidden");
            document.getElementById("reward-intro").classList.remove("hidden");
            document.getElementById("final-quiz-score").innerText = `你的问答总得分：${score} 分！`;
        }


        /* ------------------- 2. 奖励游戏：躲避汽车 ------------------- */
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let carGameInterval = null;
        let carTimerInterval = null;
        let carTime = 0;
        let maxCarScore = 0;
        let isCarGameOver = false;

        // 玩家汽车
        const player = {
            x: 130,
            y: 280,
            width: 40,
            height: 60,
            speed: 6,
            color: "#ff3366"
        };

        // 敌方汽车数组
        let enemies = [];
        let keys = {};

        // 监听按键
        window.addEventListener("keydown", e => keys[e.key] = true);
        window.addEventListener("keyup", e => keys[e.key] = false);

        function startCarGame() {
            document.getElementById("reward-intro").classList.add("hidden");
            document.getElementById("car-game-screen").classList.remove("hidden");
            document.getElementById("restart-car-btn").classList.add("hidden");

            // 重置状态
            player.x = 130;
            enemies = [];
            carTime = 0;
            isCarGameOver = false;
            document.getElementById("car-time").innerText = carTime;

            clearInterval(carGameInterval);
            clearInterval(carTimerInterval);

            // 每秒增加存活时间
            carTimerInterval = setInterval(() => {
                if (!isCarGameOver) {
                    carTime++;
                    document.getElementById("car-time").innerText = carTime;
                }
            }, 1000);

            // 游戏主循环 (约60fps)
            carGameInterval = setInterval(updateCarGame, 1000 / 60);
        }

        function updateCarGame() {
            if (isCarGameOver) return;

            // 移动控制
            if ((keys["ArrowLeft"] || keys["a"]) && player.x > 10) {
                player.x -= player.speed;
            }
            if ((keys["ArrowRight"] || keys["d"]) && player.x < canvas.width - player.width - 10) {
                player.x += player.speed;
            }

            // 随机生成敌方汽车
            if (Math.random() < 0.04) {
                const enemyWidth = 40;
                const randomX = Math.random() * (canvas.width - enemyWidth - 20) + 10;
                const enemySpeed = 3 + Math.random() * 3 + Math.floor(carTime / 5); // 随着时间加快
                enemies.push({
                    x: randomX,
                    y: -60,
                    width: enemyWidth,
                    height: 60,
                    speed: enemySpeed,
                    color: ["#00d2d3", "#ff9f43", "#54a0ff", "#5f27cd"][Math.floor(Math.random() * 4)]
                });
            }

            // 清屏绘制
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 画马路虚线
            ctx.strokeStyle = "#fff";
            ctx.setLineDash([15, 15]);
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(150, 0);
            ctx.lineTo(150, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]); // 重置虚线

            // 绘制玩家小车
            drawCar(player.x, player.y, player.width, player.height, player.color, true);

            // 更新并绘制敌方汽车
            for (let i = 0; i < enemies.length; i++) {
                let e = enemies[i];
                e.y += e.speed;

                drawCar(e.x, e.y, e.width, e.height, e.color, false);

                // 碰撞检测
                if (checkCollision(player, e)) {
                    endCarGame();
                }

                // 移除跑出屏幕的车
                if (e.y > canvas.height) {
                    enemies.splice(i, 1);
                    i--;
                }
            }
        }

        // 简单的汽车绘制函数
        function drawCar(x, y, w, h, color, isPlayer) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, 8);
            ctx.fill();

            // 车窗
            ctx.fillStyle = "#ffffff";
            const windowY = isPlayer ? y + 10 : y + 35;
            ctx.fillRect(x + 5, windowY, w - 10, 15);

            // 车轮
            ctx.fillStyle = "#000";
            ctx.fillRect(x - 3, y + 8, 4, 12);
            ctx.fillRect(x + w, y + 8, 4, 12);
            ctx.fillRect(x - 3, y + h - 20, 4, 12);
            ctx.fillRect(x + w, y + h - 20, 4, 12);
        }

        // 矩形碰撞检测
        function checkCollision(r1, r2) {
            return !(r1.x > r2.x + r2.width ||
                     r1.x + r1.width < r2.x ||
                     r1.y > r2.y + r2.height ||
                     r1.y + r1.height < r2.y);
        }

        function endCarGame() {
            isCarGameOver = true;
            clearInterval(carGameInterval);
            clearInterval(carTimerInterval);

            if (carTime > maxCarScore) {
                maxCarScore = carTime;
                document.getElementById("car-score").innerText = maxCarScore;
            }

            // 显示游戏结束文字
            ctx.fillStyle = "rgba(0,0,0,0.7)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = "bold 24px Arial";
            ctx.fillStyle = "#ff4757";
            ctx.textAlign = "center";
            ctx.fillText("💥 碰撞啦！", canvas.width / 2, 150);

            ctx.font = "18px Arial";
            ctx.fillStyle = "#fff";
            ctx.fillText(`你坚持了 ${carTime} 秒`, canvas.width / 2, 190);

            document.getElementById("restart-car-btn").classList.remove("hidden");
        }

        // 启动第一个问题
        loadQuestion();
    </script>
</body>
</html>
